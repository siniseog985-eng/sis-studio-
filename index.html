<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LP STUDIO - Album & Lyrics Workspace</title>
<style>
:root{--bg:#000;--nav:#121212;--input:#242424;--muted:#a7a7a7;--green:#1db954;--red:#e50914;--border:rgba(255,255,255,.1)}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",system-ui,sans-serif}body{background:var(--bg);color:#fff;height:100vh;overflow:hidden}.gateway{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:.3s}.gateway.hidden{opacity:0;pointer-events:none;transform:scale(1.03)}h1{font-size:2.2rem;margin-bottom:40px}.albums{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;max-width:90%;min-height:150px;margin-bottom:50px}.album-card{width:140px;text-align:center;cursor:pointer;position:relative}.album-art{width:140px;height:140px;background:#1e1e1e;border:1px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 15px #000}.album-art img,.big-art img,.track-art img{width:100%;height:100%;object-fit:cover}.placeholder{position:absolute;color:#444;font-weight:800;z-index:0}.album-art img,.big-art img,.track-art img{position:relative;z-index:1}.album-name{margin-top:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album-type{margin-top:4px;color:var(--muted);font-size:.8rem}.actions{display:flex;gap:16px}.btn{background:transparent;color:var(--muted);border:1px solid var(--muted);padding:10px 24px;border-radius:4px;font-weight:700;cursor:pointer}.btn:hover{color:#fff;border-color:#fff}.manage .delete-album{display:flex}.delete-album{display:none;position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;border:1px solid #555;background:#000;color:#fff;z-index:4;align-items:center;justify-content:center}.app{height:100vh;padding:8px;gap:8px;display:none}.app.show{display:flex}.sidebar{width:340px;flex-shrink:0;background:var(--nav);border-radius:8px;padding:20px;display:flex;flex-direction:column}.side-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:20px}.side-head h2{font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.back{background:transparent;color:var(--muted);border:1px solid #333;padding:5px 10px;border-radius:4px}.input-row{display:flex;gap:8px;margin-bottom:10px}.input-row input{flex:1}.green{background:var(--green);border:0;color:#000;font-weight:700;border-radius:4px;padding:0 16px}.hint{font-size:.72rem;color:var(--muted);margin:0 0 10px 4px}.tracks{list-style:none;overflow:auto;display:flex;flex-direction:column;gap:8px}.track{padding:12px;border-radius:6px;display:flex;gap:12px;align-items:center;cursor:pointer}.track:hover,.track.active{background:rgba(255,255,255,.08)}.track-art{width:44px;height:44px;background:#282828;border:1px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}.track-info{flex:1;min-width:0}.track-title{display:flex;justify-content:space-between;gap:8px}.track-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.active .track-name{color:var(--green)}.badge{font-size:.65rem;background:var(--green);color:#000;padding:1px 4px;border-radius:2px;font-weight:800}.tag{font-size:.7rem;color:var(--muted);background:#282828;padding:2px 6px;border-radius:4px}.del{background:transparent;border:0;color:var(--muted);cursor:pointer}.workspace{flex:1;display:flex;gap:8px;min-width:0}.main{flex:1.3;background:var(--nav);border-radius:8px;overflow:auto}.banner{padding:40px 32px 24px;background:linear-gradient(#434343,#121212);display:flex;align-items:flex-end;gap:24px}.big-art{width:180px;height:180px;background:#282828;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;cursor:pointer}.info{display:flex;flex-direction:column;gap:8px;min-width:0}.type{font-size:.85rem;font-weight:700}.title{font-size:3rem;font-weight:900;line-height:1;word-break:break-all}.meta{color:var(--muted);font-size:.88rem}.artist{color:#fff;font-weight:700}.desc{color:#b3b3b3;font-size:.83rem;white-space:pre-wrap}.player{display:flex;align-items:center;gap:20px;padding:24px 32px;border-bottom:1px solid var(--border);background:#080808}.play{width:56px;height:56px;border:0;border-radius:50%;background:var(--green);font-size:24px;cursor:pointer}.bar{flex:1;height:5px;background:#444;border-radius:4px;cursor:pointer}.fill{height:100%;width:0;background:#fff;border-radius:4px}.time{font-size:.75rem;color:var(--muted);min-width:38px}.body{padding:32px;display:flex;flex-direction:column;gap:28px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:.72rem;color:var(--muted);font-weight:700}.field input,.field textarea,.lyrics textarea,.new input{width:100%;background:var(--input);border:1px solid transparent;color:#fff;border-radius:6px;padding:12px;outline:0}.field textarea{min-height:80px;resize:vertical}.todos{border:1px solid var(--border);border-radius:6px;overflow:hidden}.todo{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)}.todo:last-child{border-bottom:0}.todo span{flex:1}.done{text-decoration:line-through;color:#555}.lyrics{width:380px;flex-shrink:0;background:var(--nav);border-radius:8px;padding:24px;display:flex;flex-direction:column}.lyrics-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px}.lyrics textarea{flex:1;resize:none;line-height:1.6}.modal{display:none;position:fixed;inset:0;background:rgba(10,10,10,.97);z-index:20;padding:30px;flex-direction:column}.modal.open{display:flex}.modal textarea{flex:1;background:#141414;color:#fff;border:1px solid #333;border-radius:8px;padding:24px;font-size:1.1rem;line-height:1.8;resize:none}input{min-width:0}#file,#cover,#audio{display:none}
@media(max-width:900px){body{overflow:auto}.gateway{min-height:100dvh;height:auto}.gateway h1{font-size:1.55rem;text-align:center}.albums{gap:16px}.album-card,.album-art{width:115px}.album-art{height:115px}.app.show{height:auto;min-height:100dvh;display:block;padding:0}.sidebar{width:100%;border-radius:0;padding:14px}.tracks{max-height:180px}.workspace{display:block}.main,.lyrics{border-radius:0;width:100%}.banner{padding:24px 18px;align-items:center;gap:16px}.big-art{width:110px;height:110px}.title{font-size:2rem}.player{padding:16px 18px;gap:10px}.body{padding:20px 18px}.grid{grid-template-columns:1fr 1fr}.lyrics{min-height:420px;padding:18px}.modal{padding:18px 14px}}
</style></head>
<body>
<div class="gateway" id="gateway"><h1>프로젝트를 진행할 앨범을 선택하세요.</h1><div class="albums" id="albums"></div><div class="actions"><button class="btn" id="manage" onclick="toggleManage()">프로필 관리</button><button class="btn" onclick="newAlbum()">새 앨범 추가</button></div></div>
<div class="app" id="app"><aside class="sidebar"><div class="side-head"><h2 id="albumHead">내 라이브러리</h2><button class="back" onclick="back()">◀ 앨범 목록</button></div><div class="input-row new"><input id="trackInput" placeholder="새 트랙 제목 입력..." onkeydown="if(event.key==='Enter')addTrack()"><button class="green" onclick="addTrack()">추가</button></div><div class="hint">더블클릭: 타이틀 지정</div><ul class="tracks" id="tracks"></ul></aside><main class="workspace" id="workspace"></main></div>
<div class="modal" id="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><b id="modalTitle">가사 몰입 모드</b><button class="btn" onclick="closeLyrics()">닫기</button></div><textarea id="modalLyrics" oninput="saveLyrics(this.value)"></textarea></div>
<input id="file" type="file" accept="image/*" onchange="trackImage(event)"><input id="cover" type="file" accept="image/*" onchange="albumImage(event)"><input id="audio" type="file" accept="audio/*" onchange="audioFile(event)">
<script>
const KEY='LP_STUDIO_ORIGINAL_V1',defaults=['레퍼런스 분석 및 코드 워크 확정','가이드 멜로디 및 데모 녹음','1차 미디(MIDI) 편곡 및 비트 메이킹','리릭(작사) 최종 디벨롭 및 확정','세션 녹음 및 오디오 정리','메인 보컬 및 코러스 레코딩'];let albums=[],aid=null,tid=null,audio=null,manage=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(albums));const album=()=>albums.find(x=>x.id===aid);const track=()=>album()?.tracks?.find(x=>x.id===tid);
function init(){try{albums=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){albums=[]}if(!albums.length){albums=[{id:1,name:'FOCUS - The 1st Mini Album',type:'EP',cover:'',description:'',artist:'Hearts2Hearts',year:'2026',tracks:[]}];save()}renderAlbums()}
function renderAlbums(){albumsEl().innerHTML=albums.map(a=>`<div class="album-card" onclick="${manage?`pickCover(${a.id})`:`enter(${a.id})`}"><button class="delete-album" onclick="delAlbum(${a.id},event)">×</button><div class="album-art"><span class="placeholder">LP</span>${a.cover?`<img src="${a.cover}">`:''}</div><div class="album-name">${esc(a.name)}</div><div class="album-type">${esc(a.type||'정규 앨범')}</div></div>`).join('')};const albumsEl=()=>document.getElementById('albums');
function newAlbum(){let n=prompt('새로운 앨범 또는 프로젝트 명을 입력해 주세요:');if(!n?.trim())return;let t=prompt('앨범 유형을 입력해 주세요 (예: 정규 앨범, EP, 싱글 앨범):','EP')||'EP';albums.push({id:Date.now(),name:n.trim(),type:t,cover:'',description:'',artist:'Hearts2Hearts',year:'2026',tracks:[]});save();renderAlbums()}
function delAlbum(id,e){e.stopPropagation();if(confirm('이 앨범의 데이터가 영구 삭제됩니다. 삭제할까요?')){albums=albums.filter(a=>a.id!==id);save();renderAlbums()}}
function toggleManage(){manage=!manage;document.getElementById('gateway').classList.toggle('manage',manage);document.getElementById('manage').textContent=manage?'완료':'프로필 관리';renderAlbums()}
function pickCover(id){document.getElementById('cover').dataset.id=id;document.getElementById('cover').click()};function albumImage(e){let f=e.target.files[0],id=+e.target.dataset.id;if(!f)return;let r=new FileReader;r.onload=x=>{let a=albums.find(a=>a.id===id);a.cover=x.target.result;save();renderAlbums()};r.readAsDataURL(f)}
function enter(id){aid=id;tid=null;stop();document.getElementById('albumHead').textContent=album().name;document.getElementById('gateway').classList.add('hidden');document.getElementById('app').classList.add('show');renderTracks();renderWorkspace()};function back(){aid=null;tid=null;stop();document.getElementById('gateway').classList.remove('hidden');document.getElementById('app').classList.remove('show');renderAlbums()}
function addTrack(){let i=document.getElementById('trackInput'),n=i.value.trim();if(!n)return;let a=album(),id=Date.now();a.tracks.push({id,name:n,image:'',lyrics:'',artist:a.artist,year:a.year,genre:'Synth Pop',bpm:'120',key:'C Maj',description:'',isTitle:false,audioSrc:'',audioName:'',todos:defaults.map((x,j)=>({id:id+j+1,text:x,completed:false}))});i.value='';save();tid=id;renderTracks();renderWorkspace()}
function renderTracks(){let a=album(),el=document.getElementById('tracks');el.innerHTML=(a?.tracks||[]).map((t,i)=>{let d=t.todos.filter(x=>x.completed).length,p=Math.round(d/t.todos.length*100);return `<li class="track ${t.id===tid?'active':''}" onclick="selectTrack(${t.id})" ondblclick="titleTrack(${t.id},event)"><div class="track-art"><span class="placeholder">TRACK</span>${t.image?`<img src="${t.image}">`:''}</div><div class="track-info"><div class="track-title"><div>${t.isTitle?'<span class="badge">TITLE</span> ':''}<span class="track-name">${i+1}. ${esc(t.name)}</span></div><button class="del" onclick="delTrack(${t.id},event)">삭제</button></div><div class="track-title"><span class="tag">${esc(t.genre||'-')}</span><span style="font-size:.7rem;color:#a7a7a7">${p}%</span></div></div></li>`}).join('')}
function selectTrack(id){if(tid!==id)stop();tid=id;renderTracks();renderWorkspace()};function titleTrack(id,e){e.stopPropagation();let t=album().tracks.find(x=>x.id===id);t.isTitle=!t.isTitle;save();renderTracks();renderWorkspace()};function delTrack(id,e){e.stopPropagation();if(!confirm('이 트랙을 삭제할까요?'))return;album().tracks=album().tracks.filter(x=>x.id!==id);if(tid===id){tid=null;stop()}save();renderTracks();renderWorkspace()}
function renderWorkspace(){let a=album(),t=track();if(!a)return;if(!t){document.getElementById('workspace').innerHTML=`<section class="main"><div class="banner"><div class="big-art"><span class="placeholder">ALBUM</span>${a.cover?`<img src="${a.cover}">`:''}</div><div class="info"><div class="type">${esc(a.type)} • PROJECT</div><div class="title">${esc(a.name)}</div><div class="meta"><span class="artist">${esc(a.artist)}</span> • ${esc(a.year)}</div><div class="desc">${esc(a.description||'작성된 앨범 설명이 없습니다.')}</div></div></div><div class="body"><b>대시보드가 활성화되었습니다!</b><p style="color:#a7a7a7">왼쪽 사이드바에서 새 트랙을 추가하면 상세 작업 공간이 열립니다.</p><div class="grid"><div class="field"><label>기본 아티스트 명 설정</label><input value="${esc(a.artist)}" oninput="albumMeta()" id="artist"></div><div class="field"><label>기본 제작 연도 설정</label><input value="${esc(a.year)}" oninput="albumMeta()" id="year"></div></div><div class="field"><label>앨범 소개 / 스토리라인 설명</label><textarea id="albumDesc" oninput="albumMeta()">${esc(a.description)}</textarea></div></div></section>`;return}
let done=t.todos.filter(x=>x.completed).length;document.getElementById('workspace').innerHTML=`<section class="main"><div class="banner"><div class="big-art onclick" onclick="document.getElementById('file').click()"><span class="placeholder">TRACK</span>${t.image?`<img src="${t.image}">`:a.cover?`<img src="${a.cover}">`:''}</div><div class="info"><div class="type">${t.isTitle?'TITLE TRACK':'TRACK'} • ${esc(a.name)}</div><div class="title">${esc(t.name)}</div><div class="meta"><span class="artist">${esc(t.artist)}</span> • ${esc(t.year)}</div>${a.description?`<div class="desc">${esc(a.description)}</div>`:''}</div></div><div class="player"><button class="play" onclick="togglePlay()">${audio&&!audio.paused?'Ⅱ':'▶'}</button><span class="time" id="cur">0:00</span><div class="bar" onclick="seek(event)"><div class="fill" id="fill"></div></div><span class="time" id="dur">0:00</span><button class="btn" onclick="document.getElementById('audio').click()">📁 ${esc(t.audioName||'음원 등록')}</button></div><div class="body"><div class="grid">${[['artist','아티스트'],['year','제작 연도'],['genre','장르'],['bpm','BPM'],['key','KEY']].map(([k,l])=>`<div class="field"><label>${l}</label><input value="${esc(t[k])}" oninput="spec('${k}',this.value)"></div>`).join('')}</div><div class="field"><label>트랙 곡 설명 / 기획 콘셉트</label><textarea oninput="spec('description',this.value)">${esc(t.description)}</textarea></div><div><h3 style="margin-bottom:12px">제작 체크리스트 (${done}/${t.todos.length})</h3><div class="input-row new"><input id="todoInput" placeholder="새로운 체크리스트 항목 입력..." onkeydown="if(event.key==='Enter')addTodo()"><button class="green" onclick="addTodo()">추가</button></div><div class="todos">${t.todos.map(x=>`<div class="todo"><input type="checkbox" ${x.completed?'checked':''} onchange="toggleTodo(${x.id})"><span class="${x.completed?'done':''}">${esc(x.text)}</span><button class="del" onclick="deleteTodo(${x.id})">×</button></div>`).join('')}</div></div></div></section><aside class="lyrics"><div class="lyrics-head"><b>가사 (Lyrics) Workspace</b><button class="btn" onclick="openLyrics()">전체화면</button></div><textarea id="lyrics" oninput="saveLyrics(this.value)" placeholder="이 트랙의 가사를 자유롭게 작성하세요...">${esc(t.lyrics)}</textarea></aside>`;if(t.audioSrc&&!audio)loadAudio(t.audioSrc)}
function albumMeta(){let a=album();a.artist=document.getElementById('artist').value;a.year=document.getElementById('year').value;a.description=document.getElementById('albumDesc').value;save()};function spec(k,v){track()[k]=v;save();if(k==='genre')renderTracks()};function trackImage(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=x=>{track().image=x.target.result;save();renderTracks();renderWorkspace()};r.readAsDataURL(f)}
function audioFile(e){let f=e.target.files[0];if(!f)return;stop();track().audioSrc=URL.createObjectURL(f);track().audioName=f.name;save();loadAudio(track().audioSrc);renderWorkspace()};function loadAudio(src){stop();audio=new Audio(src);audio.ontimeupdate=progress;audio.onloadedmetadata=progress;audio.onended=()=>renderWorkspace()};function stop(){if(audio){audio.pause();audio.src='';audio=null}}function togglePlay(){if(!audio){alert('먼저 음원 파일(오디오)을 등록해 주세요.');return}audio.paused?audio.play():audio.pause();renderWorkspace()};function progress(){if(!audio||!audio.duration)return;let p=audio.currentTime/audio.duration*100;let f=document.getElementById('fill');if(f)f.style.width=p+'%';let c=document.getElementById('cur'),d=document.getElementById('dur');if(c)c.textContent=fmt(audio.currentTime);if(d)d.textContent=fmt(audio.duration)}function seek(e){if(!audio?.duration)return;let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration};function fmt(s){let m=Math.floor(s/60),x=Math.floor(s%60);return `${m}:${x<10?'0':''}${x}`}
function addTodo(){let i=document.getElementById('todoInput'),v=i.value.trim();if(!v)return;track().todos.push({id:Date.now(),text:v,completed:false});save();renderTracks();renderWorkspace()};function toggleTodo(id){let x=track().todos.find(x=>x.id===id);x.completed=!x.completed;save();renderTracks();renderWorkspace()};function deleteTodo(id){track().todos=track().todos.filter(x=>x.id!==id);save();renderTracks();renderWorkspace()};function saveLyrics(v){track().lyrics=v;save()};function openLyrics(){document.getElementById('modalTitle').textContent=track().name+' - 가사 몰입 모드';document.getElementById('modalLyrics').value=track().lyrics;document.getElementById('modal').classList.add('open')};function closeLyrics(){document.getElementById('modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLyrics()});init();
</script></body></html>
